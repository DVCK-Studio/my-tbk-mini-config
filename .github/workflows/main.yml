name: Build ZMK firmware

on:
  workflow_dispatch:
  push:

jobs:
  build-left:
    runs-on: ubuntu-latest
    steps:
      - name: Build left half
        uses: zmkfirmware/zmk-action-build@v3
        with:
          board: nice_nano_v2
          shield: tbk_mini_left

  build-right:
    runs-on: ubuntu-latest
    steps:
      - name: Build right half
        uses: zmkfirmware/zmk-action-build@v3
        with:
          board: nice_nano_v2
          shield: tbk_mini_right
